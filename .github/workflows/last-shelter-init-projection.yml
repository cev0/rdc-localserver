name: Last Shelter Init Projection

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'last_shelter_init_projection.js'
      - 'last_shelter_init_projection_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-init-projection.yml'
  pull_request:
    paths:
      - 'last_shelter_init_projection.js'
      - 'last_shelter_init_projection_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-init-projection.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_init_projection_testi.js
