name: Last Shelter Economy Event Runtime

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'runtime_last_shelter_economy_event_read_commands.js'
      - 'runtime_last_shelter_economy_event_read_commands_testi.js'
      - 'last_shelter_activity_reference.js'
      - 'last_shelter_shop_reference.js'
      - 'last_shelter_repay_reference.js'
      - 'last_shelter_vip_store_reference.js'
      - 'last_shelter_vip_store_runtime.js'
      - 'last_shelter_alliance_group_purchase_reference.js'
      - 'last_shelter_alliance_runtime_contract.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-economy-event-runtime.yml'
  pull_request:
    paths:
      - 'runtime_last_shelter_economy_event_read_commands.js'
      - 'runtime_last_shelter_economy_event_read_commands_testi.js'
      - 'last_shelter_activity_reference.js'
      - 'last_shelter_shop_reference.js'
      - 'last_shelter_repay_reference.js'
      - 'last_shelter_vip_store_reference.js'
      - 'last_shelter_vip_store_runtime.js'
      - 'last_shelter_alliance_group_purchase_reference.js'
      - 'last_shelter_alliance_runtime_contract.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-economy-event-runtime.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node runtime_last_shelter_economy_event_read_commands_testi.js
