name: Inspect Research Cost Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - server-trade-development-bridge-v1

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print research start context
        shell: python
        run: |
          from pathlib import Path
          s = Path('server.js').read_text(encoding='utf-8')
          needles = ['technology_research_start', 'currentResearch', 'def.costs', 'canAffordCost', 'hasEnoughResources']
          for needle in needles:
              print('\n###', needle)
              start = 0
              found = False
              while True:
                  i = s.find(needle, start)
                  if i < 0: break
                  found = True
                  a = max(0, i-1400); b = min(len(s), i+2600)
                  print(s[a:b])
                  print('\n---MATCH---\n')
                  start = i + len(needle)
              if not found: print('NOT FOUND')
