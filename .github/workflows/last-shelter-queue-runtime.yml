name: Last Shelter Queue Runtime

on:
  push:
    branches: [server-v2-scalable]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  queue-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify reference-derived queue lifecycle
        run: node last_shelter_queue_runtime_testi.js
