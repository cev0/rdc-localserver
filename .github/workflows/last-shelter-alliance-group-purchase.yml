name: Last Shelter Alliance Group Purchase

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'last_shelter_alliance_group_purchase_reference.js'
      - 'last_shelter_alliance_group_purchase_reference_testi.js'
      - 'last_shelter_alliance_runtime_contract.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-alliance-group-purchase.yml'
  pull_request:
    paths:
      - 'last_shelter_alliance_group_purchase_reference.js'
      - 'last_shelter_alliance_group_purchase_reference_testi.js'
      - 'last_shelter_alliance_runtime_contract.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-alliance-group-purchase.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_alliance_group_purchase_reference_testi.js
      - run: node last_shelter_alliance_runtime_contract_testi.js
