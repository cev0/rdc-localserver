name: Last Shelter Queue Science Runtime

on:
  push:
    branches: [main]
    paths:
      - 'runtime_last_shelter_queue_science_commands.js'
      - 'runtime_last_shelter_queue_science_commands_testi.js'
      - 'last_shelter_queue_runtime.js'
      - 'last_shelter_queue_kataloqu.js'
      - 'last_shelter_science_kataloqu.js'
      - 'last_shelter_science_runtime_adapteri.js'
      - 'last_shelter_science_full_topology.js'
      - 'last_shelter_science_prerequisite_runtime.js'
      - 'last_shelter_science_mutation.js'
      - 'last_shelter_science_mutation_testi.js'
      - 'last_shelter_science_hero_skill_reference.js'
      - 'last_shelter_science_hero_skill_reference_testi.js'
      - 'last_shelter_science_native_flow_reference.js'
      - 'last_shelter_science_native_flow_reference_testi.js'
      - 'last_shelter_science_gold_catalog_probe.js'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-queue-science-runtime.yml'
  pull_request:
    paths:
      - 'runtime_last_shelter_queue_science_commands.js'
      - 'runtime_last_shelter_queue_science_commands_testi.js'
      - 'last_shelter_queue_runtime.js'
      - 'last_shelter_queue_kataloqu.js'
      - 'last_shelter_science_kataloqu.js'
      - 'last_shelter_science_runtime_adapteri.js'
      - 'last_shelter_science_full_topology.js'
      - 'last_shelter_science_prerequisite_runtime.js'
      - 'last_shelter_science_mutation.js'
      - 'last_shelter_science_mutation_testi.js'
      - 'last_shelter_science_hero_skill_reference.js'
      - 'last_shelter_science_hero_skill_reference_testi.js'
      - 'last_shelter_science_native_flow_reference.js'
      - 'last_shelter_science_native_flow_reference_testi.js'
      - 'last_shelter_science_gold_catalog_probe.js'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-queue-science-runtime.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node last_shelter_queue_runtime_testi.js
      - run: node last_shelter_science_kataloqu_testi.js
      - run: node last_shelter_science_runtime_adapteri_testi.js
      - run: node last_shelter_science_full_topology_testi.js
      - run: node last_shelter_science_prerequisite_runtime_testi.js
      - run: node last_shelter_science_hero_skill_reference_testi.js
      - run: node last_shelter_science_native_flow_reference_testi.js
      - name: Probe native science gold catalog rows
        run: node last_shelter_science_gold_catalog_probe.js
      - run: node last_shelter_science_mutation_testi.js
      - run: node runtime_last_shelter_queue_science_commands_testi.js
