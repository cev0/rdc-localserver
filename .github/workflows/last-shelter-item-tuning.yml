name: Last Shelter Item Tuning

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-item-tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Last Shelter item.xml tuning rows
        run: node last_shelter_item_tuning_kataloqu_testi.js
