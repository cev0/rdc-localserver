name: pvp-report-commander-name

on:
  push:
    paths:
      - 'pvp_raport_oyuncu_adi_override.js'
      - 'pvp_raport_oyuncu_adi_override_testi.js'
      - 'server_missiya_genisletme.js'
  pull_request:
    paths:
      - 'pvp_raport_oyuncu_adi_override.js'
      - 'pvp_raport_oyuncu_adi_override_testi.js'
      - 'server_missiya_genisletme.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node pvp_raport_oyuncu_adi_override_testi.js
