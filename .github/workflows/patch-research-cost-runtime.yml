name: Patch Research Cost Runtime

on:
  push:
    branches:
      - server-research-cost-development-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-research-cost-development-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch technology research runtime
        shell: python
        run: |
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          def function_slice(source, name):
              marker = f'function {name}'
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'{name} not found')
              end = source.find('\nfunction ', start + len(marker))
              if end < 0:
                  raise SystemExit(f'end of {name} not found')
              return start, end, source[start:end]

          start, end, fn = function_slice(s, 'canStartTechnologyResearch')
          if 'const effectiveCost = Array.isArray(developmentModifier.effektivXerc)' not in fn:
              needle = '  const check = hasEnoughResources(state, levelData.cost);'
              replacement = '\n'.join([
                  '  const { texnologiyaInkIsafModifikatorunuHesabla } = require("./texnologiya_inkisaf_korpu");',
                  '  const developmentModifier = texnologiyaInkIsafModifikatorunuHesabla(',
                  '    state,',
                  '    levelData.researchTimeSeconds,',
                  '    levelData.cost',
                  '  );',
                  '  const effectiveCost = Array.isArray(developmentModifier.effektivXerc)',
                  '    ? developmentModifier.effektivXerc',
                  '    : levelData.cost;',
                  '',
                  '  const check = hasEnoughResources(state, effectiveCost);'
              ])
              if needle not in fn:
                  raise SystemExit('research affordability line not found')
              fn = fn.replace(needle, replacement, 1)
              return_needle = '    institute,\n    levelData\n  };'
              return_replacement = '    institute,\n    levelData,\n    effectiveCost,\n    developmentModifier\n  };'
              if return_needle not in fn:
                  raise SystemExit('research can-start return block not found')
              fn = fn.replace(return_needle, return_replacement, 1)
              s = s[:start] + fn + s[end:]

          start, end, fn = function_slice(s, 'startTechnologyResearch')
          if 'researchCostReductionPercent:' not in fn:
              needle = '  const levelData = check.levelData;\n\n  spendResources(state, levelData.cost);'
              replacement = '\n'.join([
                  '  const levelData = check.levelData;',
                  '  const developmentModifier = check.developmentModifier || {};',
                  '  const effectiveDurationSeconds = Math.max(',
                  '    1,',
                  '    Math.trunc(Number(developmentModifier.effektivMuddetSaniye) || levelData.researchTimeSeconds || 1)',
                  '  );',
                  '  const effectiveCost = Array.isArray(check.effectiveCost) ? check.effectiveCost : levelData.cost;',
                  '',
                  '  spendResources(state, effectiveCost);'
              ])
              if needle not in fn:
                  raise SystemExit('research spend block not found')
              fn = fn.replace(needle, replacement, 1)

              duration_needle = '\n'.join([
                  '    durationMs: Math.max(0, Math.round(levelData.researchTimeSeconds * 1000)),',
                  '    endsAtMs: now + Math.max(0, Math.round(levelData.researchTimeSeconds * 1000)),',
                  '    instituteInstanceId: check.institute.instanceId'
              ])
              duration_replacement = '\n'.join([
                  '    durationMs: effectiveDurationSeconds * 1000,',
                  '    endsAtMs: now + effectiveDurationSeconds * 1000,',
                  '    instituteInstanceId: check.institute.instanceId,',
                  '    baseDurationSeconds: Math.max(1, Math.trunc(Number(levelData.researchTimeSeconds) || 1)),',
                  '    researchSpeedPercent: Math.max(0, Number(developmentModifier.tedqiqatSuretiFaiz) || 0),',
                  '    researchCostReductionPercent: Math.max(0, Math.min(100, Number(developmentModifier.tedqiqatXerciEndirimFaiz) || 0)),',
                  '    baseCost: Array.isArray(levelData.cost) ? levelData.cost.map(x => ({ ...x })) : [],',
                  '    effectiveCost: effectiveCost.map(x => ({ ...x }))'
              ])
              if duration_needle not in fn:
                  raise SystemExit('research duration block not found')
              fn = fn.replace(duration_needle, duration_replacement, 1)
              s = s[:start] + fn + s[end:]

          p.write_text(s, encoding='utf-8')

          t = Path('texnologiya_inkisaf_xerc_runtime_testi.js')
          t.write_text('''"use strict";\nconst assert = require("assert");\nconst fs = require("fs");\nconst source = fs.readFileSync("./server.js", "utf8");\nassert.ok(source.includes('const effectiveCost = Array.isArray(developmentModifier.effektivXerc)'));\nassert.ok(source.includes('hasEnoughResources(state, effectiveCost)'));\nassert.ok(source.includes('spendResources(state, effectiveCost);'));\nassert.ok(source.includes('researchCostReductionPercent'));\nassert.ok(source.includes('researchSpeedPercent'));\nassert.ok(source.includes('effectiveCost: effectiveCost.map'));\nconsole.log("Texnologiya İnkişaf xərc runtime testi uğurla keçdi.");\n''', encoding='utf-8')
      - name: Run tests
        run: |
          node texnologiya_inkisaf_korpu_testi.js
          node texnologiya_inkisaf_xerc_testi.js
          node texnologiya_inkisaf_xerc_runtime_testi.js
          node --check server.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js texnologiya_inkisaf_xerc_runtime_testi.js
          git commit -m "Integrate research development cost reduction"
          git push origin HEAD:server-research-cost-development-v1
