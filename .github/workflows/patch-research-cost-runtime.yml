name: Patch Research Cost Runtime

on:
  push:
    branches:
      - server-research-cost-development-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-research-cost-development-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch technology research runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          old_check = '''  const check = hasEnoughResources(state, levelData.cost);
          if (!check.ok) {
            return {
              ok: false,
              message: `Not enough ${check.resource}. Need ${check.need}, have ${check.have}`
            };
          }

          return {
            ok: true,
            institute,
            levelData
          };'''
          new_check = '''  const { texnologiyaInkIsafModifikatorunuHesabla } = require("./texnologiya_inkisaf_korpu");
          const developmentModifier = texnologiyaInkIsafModifikatorunuHesabla(
            state,
            levelData.researchTimeSeconds,
            levelData.cost
          );
          const effectiveCost = Array.isArray(developmentModifier.effektivXerc)
            ? developmentModifier.effektivXerc
            : levelData.cost;

          const check = hasEnoughResources(state, effectiveCost);
          if (!check.ok) {
            return {
              ok: false,
              message: `Not enough ${check.resource}. Need ${check.need}, have ${check.have}`
            };
          }

          return {
            ok: true,
            institute,
            levelData,
            effectiveCost,
            developmentModifier
          };'''
          if new_check not in s:
              if old_check not in s:
                  raise SystemExit('canStartTechnologyResearch cost block not found')
              s = s.replace(old_check, new_check, 1)

          old_start = '''  const now = nowMs();
          const levelData = check.levelData;

          spendResources(state, levelData.cost);

          state.technology.currentResearch = {
            techId: levelData.techId,
            targetLevel: levelData.targetLevel,
            startedAtMs: now,
            durationMs: Math.max(0, Math.round(levelData.researchTimeSeconds * 1000)),
            endsAtMs: now + Math.max(0, Math.round(levelData.researchTimeSeconds * 1000)),
            instituteInstanceId: check.institute.instanceId
          };'''
          new_start = '''  const now = nowMs();
          const levelData = check.levelData;
          const developmentModifier = check.developmentModifier || {};
          const effectiveDurationSeconds = Math.max(
            1,
            Math.trunc(Number(developmentModifier.effektivMuddetSaniye) || levelData.researchTimeSeconds || 1)
          );
          const effectiveCost = Array.isArray(check.effectiveCost) ? check.effectiveCost : levelData.cost;

          spendResources(state, effectiveCost);

          state.technology.currentResearch = {
            techId: levelData.techId,
            targetLevel: levelData.targetLevel,
            startedAtMs: now,
            durationMs: effectiveDurationSeconds * 1000,
            endsAtMs: now + effectiveDurationSeconds * 1000,
            instituteInstanceId: check.institute.instanceId,
            baseDurationSeconds: Math.max(1, Math.trunc(Number(levelData.researchTimeSeconds) || 1)),
            researchSpeedPercent: Math.max(0, Number(developmentModifier.tedqiqatSuretiFaiz) || 0),
            researchCostReductionPercent: Math.max(0, Math.min(100, Number(developmentModifier.tedqiqatXerciEndirimFaiz) || 0)),
            baseCost: Array.isArray(levelData.cost) ? levelData.cost.map(x => ({ ...x })) : [],
            effectiveCost: effectiveCost.map(x => ({ ...x }))
          };'''
          if new_start not in s:
              if old_start not in s:
                  raise SystemExit('startTechnologyResearch block not found')
              s = s.replace(old_start, new_start, 1)

          p.write_text(s, encoding='utf-8')

          t = Path('texnologiya_inkisaf_xerc_runtime_testi.js')
          t.write_text('''"use strict";\nconst assert = require("assert");\nconst fs = require("fs");\nconst source = fs.readFileSync("./server.js", "utf8");\nassert.ok(source.includes('const effectiveCost = Array.isArray(developmentModifier.effektivXerc)'));\nassert.ok(source.includes('spendResources(state, effectiveCost);'));\nassert.ok(source.includes('researchCostReductionPercent'));\nassert.ok(source.includes('researchSpeedPercent'));\nassert.ok(source.includes('effectiveCost: effectiveCost.map'));\nconsole.log("Texnologiya İnkişaf xərc runtime testi uğurla keçdi.");\n''', encoding='utf-8')
      - name: Run tests
        run: |
          node texnologiya_inkisaf_korpu_testi.js
          node texnologiya_inkisaf_xerc_testi.js
          node texnologiya_inkisaf_xerc_runtime_testi.js
          node --check server.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js texnologiya_inkisaf_xerc_runtime_testi.js
          git commit -m "Integrate research development cost reduction"
          git push origin HEAD:server-research-cost-development-v1
