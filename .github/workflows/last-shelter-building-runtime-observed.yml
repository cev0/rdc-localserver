name: Last Shelter Building Runtime Observed

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'last_shelter_building_runtime_observed_reference.js'
      - 'last_shelter_building_runtime_observed_reference_testi.js'
      - 'last_shelter_building_runtime_overlay.js'
      - 'last_shelter_building_runtime_overlay_testi.js'
      - 'last_shelter_building_kataloqu.js'
      - 'runtime_last_shelter_building_reference_commands.js'
      - 'runtime_last_shelter_building_reference_commands_testi.js'
      - 'runtime_last_shelter_command_registry_testi.js'
      - 'runtime_gameplay_mutation_commands.js'
      - 'runtime_gameplay_mutation_commands_testi.js'
      - 'runtime_build_commands.js'
      - 'runtime_build_commands_testi.js'
      - 'last_shelter_building_identity_bridge.js'
      - 'last_shelter_troop_building_reference.js'
      - 'last_shelter_troop_building_reference_testi.js'
      - 'qosun_kataloqu.js'
      - 'qosun_kataloqu_testi.js'
      - 'last_shelter_server_building_authority_cleanup_testi.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-building-runtime-observed.yml'
  pull_request:
    paths:
      - 'last_shelter_building_runtime_observed_reference.js'
      - 'last_shelter_building_runtime_observed_reference_testi.js'
      - 'last_shelter_building_runtime_overlay.js'
      - 'last_shelter_building_runtime_overlay_testi.js'
      - 'last_shelter_building_kataloqu.js'
      - 'runtime_last_shelter_building_reference_commands.js'
      - 'runtime_last_shelter_building_reference_commands_testi.js'
      - 'runtime_last_shelter_command_registry_testi.js'
      - 'runtime_gameplay_mutation_commands.js'
      - 'runtime_gameplay_mutation_commands_testi.js'
      - 'runtime_build_commands.js'
      - 'runtime_build_commands_testi.js'
      - 'last_shelter_building_identity_bridge.js'
      - 'last_shelter_troop_building_reference.js'
      - 'last_shelter_troop_building_reference_testi.js'
      - 'qosun_kataloqu.js'
      - 'qosun_kataloqu_testi.js'
      - 'last_shelter_server_building_authority_cleanup_testi.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-building-runtime-observed.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_building_runtime_observed_reference_testi.js
      - run: node last_shelter_building_runtime_overlay_testi.js
      - run: node runtime_last_shelter_building_reference_commands_testi.js
      - run: node runtime_last_shelter_command_registry_testi.js
      - run: node runtime_gameplay_mutation_commands_testi.js
      - run: node runtime_build_commands_testi.js
      - run: node last_shelter_server_building_authority_cleanup_testi.js
      - run: node last_shelter_troop_building_reference_testi.js
      - run: node qosun_kataloqu_testi.js
