name: Last Shelter Troop Reference Runtime

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'runtime_last_shelter_troop_reference_commands.js'
      - 'runtime_last_shelter_troop_reference_commands_testi.js'
      - 'qosun_kataloqu.js'
      - 'qosun_telimi_sistemi.js'
      - 'last_shelter_troop_107x_reference.js'
      - 'last_shelter_troop_107x_runtime_adapteri.js'
      - 'last_shelter_troop_building_reference.js'
      - 'last_shelter_troop_building_reference_testi.js'
      - 'qosun_kataloqu_testi.js'
      - 'last_shelter_troop_transfer_progression_reference.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-troop-reference-runtime.yml'
  pull_request:
    paths:
      - 'runtime_last_shelter_troop_reference_commands.js'
      - 'runtime_last_shelter_troop_reference_commands_testi.js'
      - 'qosun_kataloqu.js'
      - 'qosun_telimi_sistemi.js'
      - 'last_shelter_troop_107x_reference.js'
      - 'last_shelter_troop_107x_runtime_adapteri.js'
      - 'last_shelter_troop_building_reference.js'
      - 'last_shelter_troop_building_reference_testi.js'
      - 'qosun_kataloqu_testi.js'
      - 'last_shelter_troop_transfer_progression_reference.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-troop-reference-runtime.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_troop_building_reference_testi.js
      - run: node qosun_kataloqu_testi.js
      - run: node runtime_last_shelter_troop_reference_commands_testi.js
