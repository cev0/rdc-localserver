name: Last Shelter Science Cost Contract

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - "last_shelter_science_cost_contract.js"
      - "last_shelter_science_cost_contract_testi.js"
      - ".github/workflows/last-shelter-science-cost-contract.yml"
  pull_request:
    paths:
      - "last_shelter_science_cost_contract.js"
      - "last_shelter_science_cost_contract_testi.js"
      - ".github/workflows/last-shelter-science-cost-contract.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node last_shelter_science_cost_contract_testi.js
