name: Server Həssas Log Qoruması

on:
  pull_request:
    paths:
      - "server.js"
      - "email_gonderici.js"
      - "hesab_pin_berpa_email_gonderici.js"
      - "sifre_sifirlama_email_gonderici.js"
      - "email_dev_log_qoruma_testi.js"
      - "*_handler.js"
      - "server_*genisletme*.js"
      - "server_hessas_mesaj_log_qoruma_testi.js"
      - "package.json"
      - ".github/workflows/server-sensitive-log-guard.yml"
  push:
    branches:
      - main
    paths:
      - "server.js"
      - "email_gonderici.js"
      - "hesab_pin_berpa_email_gonderici.js"
      - "sifre_sifirlama_email_gonderici.js"
      - "email_dev_log_qoruma_testi.js"
      - "*_handler.js"
      - "server_*genisletme*.js"
      - "server_hessas_mesaj_log_qoruma_testi.js"
      - "package.json"
      - ".github/workflows/server-sensitive-log-guard.yml"

jobs:
  sensitive-log-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-nu al
        uses: actions/checkout@v7

      - name: Node qur
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Həssas log regression testini işə sal
        run: node server_hessas_mesaj_log_qoruma_testi.js

      - name: Production email dev-log qorumasını yoxla
        run: node email_dev_log_qoruma_testi.js
