name: Hesab Login Server Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hesab-login-server-patch.yml"

permissions:
  contents: write

jobs:
  server-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Repo-nu al
        uses: actions/checkout@v7

      - name: Login handler-i servere qos
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const serverPath = "server.js";
          const packagePath = "package.json";

          let server = fs.readFileSync(serverPath, "utf8");

          const importCode = `const {
            hesabLoginMesajiniEmalEt
          } = require("./hesab_login_handler");`;

          if (!server.includes('require("./hesab_login_handler")')) {
            const importMarker = `const {
            tesdiqKoduEmailiGonder
          } = require("./email_gonderici");`;

            if (!server.includes(importMarker)) {
              throw new Error("email_gonderici import marker-i tapilmadi");
            }

            server = server.replace(
              importMarker,
              importMarker + "\n\n" + importCode
            );
          }

          if (!server.includes("hesabLoginEmalOlundu")) {
            const typeMarker = "const type = msg.type;";
            const typeIndex = server.indexOf(typeMarker);

            if (typeIndex < 0) {
              throw new Error("const type = msg.type marker-i tapilmadi");
            }

            const switchMarker = "switch (type) {";
            const switchIndex = server.indexOf(
              switchMarker,
              typeIndex + typeMarker.length
            );

            if (switchIndex < 0) {
              throw new Error("switch (type) marker-i tapilmadi");
            }

            const daxilEt = `const hesabLoginEmalOlundu =
              await hesabLoginMesajiniEmalEt({
                type,
                msg,
                ws,
                send,
                nowMs,
                connections,
                getOrCreatePlayerState,
                updateServerTime,
                makeClientState,
                sendStateLocalMapToPlayer,
                sendWorldMapToPlayer
              });

            if (hesabLoginEmalOlundu) {
              return;
            }

            `;

            server =
              server.slice(0, switchIndex) +
              daxilEt +
              server.slice(switchIndex);
          }

          fs.writeFileSync(serverPath, server, "utf8");

          const paket = JSON.parse(
            fs.readFileSync(packagePath, "utf8")
          );

          paket.scripts = paket.scripts || {};
          paket.scripts["server:login-test"] =
            "node server_hesab_login_testi.js";

          fs.writeFileSync(
            packagePath,
            JSON.stringify(paket, null, 2) + "\n",
            "utf8"
          );
          NODE

      - name: Deyisiklikleri commit et
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js package.json
          git diff --cached --quiet && exit 0
          git commit -m "Integrate account login and session handlers"
          git push
