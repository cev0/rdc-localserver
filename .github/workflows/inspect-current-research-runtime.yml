name: Inspect Current Research Runtime

on:
  push:
    branches:
      - server-research-cost-development-v1

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print current research functions
        shell: python
        run: |
          from pathlib import Path
          s = Path('server.js').read_text(encoding='utf-8')
          for needle in ['function canStartTechnologyResearch', 'function startTechnologyResearch']:
              i = s.find(needle)
              if i < 0:
                  raise SystemExit(f'{needle} not found')
              j = s.find('\nfunction ', i + len(needle))
              print('\n### '+needle+'\n')
              print(s[i:j if j > i else i+8000])
