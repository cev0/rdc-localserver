name: Patch Resource Development Runtime

on:
  push:
    branches:
      - server-resource-development-runtime-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-resource-development-runtime-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch production runtime
        shell: python
        run: |
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          old = '''    const baseAmount = Math.max(0, Number(rule.amountPerTick) || 0);
              const productionPct = Math.max(0, Number(state.technology?.stats?.productionPct) || 0);
              const addAmount = Math.max(0, Math.floor(baseAmount * (100 + productionPct) / 100));
              if (addAmount <= 0) continue;'''
          new = '''    const baseAmount = Math.max(0, Number(rule.amountPerTick) || 0);
              const technologyProductionPct = Math.max(0, Number(state.technology?.stats?.productionPct) || 0);
              const { stateUcunBinaIstehsaliniHesabla } = require("./resurs_inkisaf_korpu");
              const productionCalculation = stateUcunBinaIstehsaliniHesabla(
                state,
                building.instanceId,
                baseAmount,
                technologyProductionPct
              );
              const addAmount = Math.max(0, Number(productionCalculation.finalAmount) || 0);
              if (addAmount <= 0) continue;'''
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected production block not found; refusing unsafe patch')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          test = Path('resurs_inkisaf_runtime_inteqrasiya_testi.js')
          test.write_text('''"use strict";\n\nconst assert = require("assert");\nconst fs = require("fs");\nconst source = fs.readFileSync("./server.js", "utf8");\nassert.ok(source.includes('require("./resurs_inkisaf_korpu")'));\nassert.ok(source.includes('stateUcunBinaIstehsaliniHesabla('));\nassert.ok(source.includes('building.instanceId'));\nassert.ok(source.includes('productionCalculation.finalAmount'));\nconsole.log("Resurs İnkişaf runtime inteqrasiya testi uğurla keçdi.");\n''', encoding='utf-8')
      - name: Test resource development integration
        run: |
          node resurs_inkisaf_korpu_testi.js
          node resurs_inkisaf_runtime_inteqrasiya_testi.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js resurs_inkisaf_runtime_inteqrasiya_testi.js
          git commit -m "Integrate resource development bonus into production runtime"
          git push origin HEAD:server-resource-development-runtime-v1
