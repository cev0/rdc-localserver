name: Last Shelter Gold Item Runtime

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'last_shelter_gold_wallet.js'
      - 'last_shelter_gold_wallet_testi.js'
      - 'last_shelter_item_runtime.js'
      - 'last_shelter_item_runtime_testi.js'
      - 'runtime_last_shelter_item_commands.js'
      - 'runtime_last_shelter_item_commands_testi.js'
      - 'server.js'
      - 'last_shelter_init_projection.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-gold-item-runtime.yml'
  pull_request:
    paths:
      - 'last_shelter_gold_wallet.js'
      - 'last_shelter_gold_wallet_testi.js'
      - 'last_shelter_item_runtime.js'
      - 'last_shelter_item_runtime_testi.js'
      - 'runtime_last_shelter_item_commands.js'
      - 'runtime_last_shelter_item_commands_testi.js'
      - 'server.js'
      - 'last_shelter_init_projection.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-gold-item-runtime.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_gold_wallet_testi.js
      - run: node last_shelter_item_runtime_testi.js
      - run: node runtime_last_shelter_item_commands_testi.js
