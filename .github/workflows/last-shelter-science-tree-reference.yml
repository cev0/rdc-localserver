name: Last Shelter Science Tree Reference

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'last_shelter_science_tree_reference.js'
      - 'last_shelter_science_tree_reference_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-science-tree-reference.yml'
  pull_request:
    paths:
      - 'last_shelter_science_tree_reference.js'
      - 'last_shelter_science_tree_reference_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-science-tree-reference.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_science_tree_reference_testi.js
