name: Last Shelter Auxiliary Runtime

on:
  push:
    branches: [main]
    paths:
      - 'last_shelter_auxiliary_runtime_reference.js'
      - 'last_shelter_auxiliary_runtime_reference_testi.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-auxiliary-runtime.yml'
  pull_request:
    paths:
      - 'last_shelter_auxiliary_runtime_reference.js'
      - 'last_shelter_auxiliary_runtime_reference_testi.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-auxiliary-runtime.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_auxiliary_runtime_reference_testi.js
