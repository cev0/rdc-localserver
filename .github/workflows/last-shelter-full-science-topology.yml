name: Last Shelter Full Science Topology

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'last_shelter_science_full_rows_*.js'
      - 'last_shelter_science_groups_reference.js'
      - 'last_shelter_science_full_topology.js'
      - 'last_shelter_science_full_topology_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-full-science-topology.yml'
  pull_request:
    paths:
      - 'last_shelter_science_full_rows_*.js'
      - 'last_shelter_science_groups_reference.js'
      - 'last_shelter_science_full_topology.js'
      - 'last_shelter_science_full_topology_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-full-science-topology.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_science_full_topology_testi.js
