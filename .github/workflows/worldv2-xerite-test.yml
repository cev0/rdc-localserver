name: WorldV2 Dövlət Xəritəsi Testləri

on:
  push:
    branches:
      - worldv2-server-hazirliq
    paths:
      - 'dovlet_xerite_worldv2_*.js'
      - 'server_missiya_genisletme_v2.js'
      - 'DOVLET_XERITESI_WORLDV2_*.md'
      - 'server_unity_message_contract_worldv2.json'
      - 'package.json'
      - '.github/workflows/worldv2-xerite-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dovlet_xerite_worldv2_*.js'
      - 'server_missiya_genisletme_v2.js'
      - 'DOVLET_XERITESI_WORLDV2_*.md'
      - 'server_unity_message_contract_worldv2.json'
      - 'package.json'
      - '.github/workflows/worldv2-xerite-test.yml'
  workflow_dispatch:

jobs:
  worldv2-xerite-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reponu götür
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: WorldV2 diff izolyasiyasını yoxla
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          xeta=0
          while IFS= read -r fayl; do
            case "$fayl" in
              dovlet_xerite_worldv2_*.js|server_missiya_genisletme_v2.js|DOVLET_XERITESI_WORLDV2_*.md|server_unity_message_contract_worldv2.json|package.json|.github/workflows/worldv2-xerite-test.yml)
                ;;
              *)
                echo "WorldV2 allowlist xaricində dəyişiklik: $fayl"
                xeta=1
                ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          if [ "$xeta" -ne 0 ]; then
            echo "WorldV2 allowlist xaricində production/legacy fayla toxunulduğu üçün CI dayandırıldı."
            exit 1
          fi
          echo "WorldV2 diff izolyasiyası OK"

      - name: Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unity mesaj müqaviləsi JSON sintaksisini yoxla
        run: node -e "JSON.parse(require('fs').readFileSync('server_unity_message_contract_worldv2.json','utf8')); console.log('WorldV2 contract JSON OK')"

      - name: WorldV2 xəritə testlərini işə sal
        run: npm run xerite:worldv2-test
