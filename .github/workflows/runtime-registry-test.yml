      - "runtime_gameplay_mutation_commands.js"
      - "runtime_gameplay_mutation_commands_testi.js"
      - "runtime_build_commands.js"
      - "runtime_build_commands_testi.js"
      - "runtime_map_mutation_commands.js"
      - "runtime_map_mutation_commands_testi.js"
      - "world_state_center_postgres.js"
      - "world_state_center_postgres_testi.js"
      - "miqrasiyalar/20260918_world_state_runtime.sql"
      - "runtime_account_commands.js"
      - "runtime_account_commands_testi.js"
      - "server_missiya_genisletme_v2.js"
      - "mesajlasma_handler.js"
      - "server_oyuncu_mutasiya_kilidi.js"
      - "server_oyuncu_mutasiya_kilidi_testi.js"
      - "server.js"
      - "package.json"
      - ".github/workflows/runtime-registry-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Test runtime registry
        run: node runtime_registry_testi.js

      - name: Test Redis runtime bus
        run: node runtime_redis_testi.js

      - name: Test runtime deployment config
        run: node runtime_deploy_config_testi.js

      - name: Test deadline scheduler
        run: node runtime_deadline_scheduler_testi.js

      - name: Test lazy production clock
        run: node runtime_production_clock_testi.js

      - name: Test request correlation envelope
        run: node runtime_protocol_envelope_testi.js

      - name: Test request idempotency
        run: node runtime_request_idempotency_testi.js

      - name: Test PostgreSQL authoritative mutation
        run: node runtime_pg_authoritative_mutation_testi.js

      - name: Test shared state teleport authority
        run: node runtime_legacy_base_teleport_testi.js

      - name: Test shared world state PostgreSQL mutation
        run: node world_state_mutasiya_postgres_testi.js

      - name: Test command router
        run: node runtime_command_router_testi.js

      - name: Test routed auth command
        run: node runtime_auth_command_testi.js

      - name: Test account-login Redis presence lifecycle
        run: node hesab_login_presence_testi.js

      - name: Test routed gameplay mutations
        run: node runtime_gameplay_mutation_commands_testi.js

      - name: Test routed build command
        run: node runtime_build_commands_testi.js

      - name: Test routed map mutations
        run: node runtime_map_mutation_commands_testi.js

      - name: Test persistent state center
        run: node world_state_center_postgres_testi.js

      - name: Test routed account commands
        run: node runtime_account_commands_testi.js

      - name: Test WebSocket runtime guard
        run: node runtime_ws_guard_testi.js

      - name: Test player mutation lock
        run: node server_oyuncu_mutasiya_kilidi_testi.js
