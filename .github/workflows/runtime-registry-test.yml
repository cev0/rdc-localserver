name: Runtime Registry Test

on:
  push:
    branches:
      - server-v2-scalable
    paths:
      - "runtime_registry.js"
      - "runtime_registry_testi.js"
      - "runtime_redis.js"
      - "runtime_redis_testi.js"
      - "runtime_deadline_scheduler.js"
      - "runtime_deadline_scheduler_testi.js"
      - "runtime_production_clock.js"
      - "runtime_production_clock_testi.js"
      - "runtime_command_router.js"
      - "runtime_command_router_testi.js"
      - "runtime_core_read_commands.js"
      - "runtime_auth_command.js"
      - "runtime_auth_command_testi.js"
      - "runtime_gameplay_mutation_commands.js"
      - "runtime_gameplay_mutation_commands_testi.js"
      - "runtime_build_commands.js"
      - "runtime_build_commands_testi.js"
      - "runtime_map_mutation_commands.js"
      - "runtime_map_mutation_commands_testi.js"
      - "server_missiya_genisletme_v2.js"
      - "mesajlasma_handler.js"
      - "server_oyuncu_mutasiya_kilidi.js"
      - "server_oyuncu_mutasiya_kilidi_testi.js"
      - "server.js"
      - "package.json"
      - ".github/workflows/runtime-registry-test.yml"
  pull_request:
    paths:
      - "runtime_registry.js"
      - "runtime_registry_testi.js"
      - "runtime_redis.js"
      - "runtime_redis_testi.js"
      - "runtime_deadline_scheduler.js"
      - "runtime_deadline_scheduler_testi.js"
      - "runtime_production_clock.js"
      - "runtime_production_clock_testi.js"
      - "runtime_command_router.js"
      - "runtime_command_router_testi.js"
      - "runtime_core_read_commands.js"
      - "runtime_auth_command.js"
      - "runtime_auth_command_testi.js"
      - "runtime_gameplay_mutation_commands.js"
      - "runtime_gameplay_mutation_commands_testi.js"
      - "runtime_build_commands.js"
      - "runtime_build_commands_testi.js"
      - "runtime_map_mutation_commands.js"
      - "runtime_map_mutation_commands_testi.js"
      - "server_missiya_genisletme_v2.js"
      - "mesajlasma_handler.js"
      - "server_oyuncu_mutasiya_kilidi.js"
      - "server_oyuncu_mutasiya_kilidi_testi.js"
      - "server.js"
      - "package.json"
      - ".github/workflows/runtime-registry-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Test runtime registry
        run: node runtime_registry_testi.js

      - name: Test Redis runtime bus
        run: node runtime_redis_testi.js

      - name: Test deadline scheduler
        run: node runtime_deadline_scheduler_testi.js

      - name: Test lazy production clock
        run: node runtime_production_clock_testi.js

      - name: Test command router
        run: node runtime_command_router_testi.js

      - name: Test routed auth command
        run: node runtime_auth_command_testi.js

      - name: Test routed gameplay mutations
        run: node runtime_gameplay_mutation_commands_testi.js

      - name: Test routed build command
        run: node runtime_build_commands_testi.js

      - name: Test routed map mutations
        run: node runtime_map_mutation_commands_testi.js

      - name: Test player mutation lock
        run: node server_oyuncu_mutasiya_kilidi_testi.js
