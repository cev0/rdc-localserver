name: Test Trade Development Bridge

on:
  push:
    branches:
      - server-trade-development-bridge-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node ticaret_inkisaf_korpu_testi.js
      - run: node qehreman_inkisaf_sistemi_testi.js
