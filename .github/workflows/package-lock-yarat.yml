name: Package Lock Yarat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/package-lock-yarat.yml"

permissions:
  contents: write

jobs:
  package-lock-yarat:
    runs-on: ubuntu-latest

    steps:
      - name: Repo-nu al
        uses: actions/checkout@v4

      - name: Node.js qur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Yeni package-lock yarat
        run: npm install --package-lock-only

      - name: Package-lock commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate package-lock with PostgreSQL"
          git push