name: Last Shelter Troop 107x Reference

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  troop-107x-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify recovered Last Shelter 107x troop contract
        run: node last_shelter_troop_107x_reference_testi.js
      - name: Probe T10 science and training building source
        run: node last_shelter_t10_training_source_probe.js
