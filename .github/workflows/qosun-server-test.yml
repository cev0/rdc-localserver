      - 'doyus_xestexana_korpu.js'
      - 'doyus_qosun_lifecycle_testi.js'
      - 'xestexana_sistemi.js'
      - 'xestexana_handler.js'
      - 'xestexana_inkisaf_override.js'
      - 'xestexana_inkisaf_override_testi.js'
      - 'doyus_sistemi.js'
      - 'doyus_qosun_stat_inteqrasiya_testi.js'
