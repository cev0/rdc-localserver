      - 'konvoy_mudafie_sistemi.js'
      - 'konvoy_handler.js'
      - 'konvoy_tutum_formulu.js'
      - 'konvoy_tutum_formulu_testi.js'
      - 'konvoy_texnologiya_handler.js'
      - 'konvoy_texnologiya_inkisaf_inteqrasiya_testi.js'
      - 'texnologiya_inkisaf_korpu.js'
      - 'texnologiya_inkisaf_korpu_testi.js'
      - 'tikinti_inkisaf_korpu.js'
      - 'tikinti_inkisaf_korpu_testi.js'
      - 'qehreman_kataloqu.js'
      - 'qehreman_exp_sistemi.js'
      - 'qehreman_exp_progression_testi.js'
      - 'qehreman_skill_qaydalari.js'
      - 'qehreman_skill_sistemi.js'
      - 'qehreman_skill_handler.js'
      - 'qehreman_skill_sistemi_testi.js'
      - 'qehreman_inkisaf_sistemi.js'
      - 'qehreman_inkisaf_sistemi_testi.js'
      - 'qehreman_tapshiriq_sistemi.js'
      - 'qehreman_tapshiriq_handler.js'
      - 'pvp_doyus_snapshot_sistemi.js'
      - 'pvp_doyus_snapshot_sistemi_testi.js'
      - 'pvp_doyus_resolver.js'
      - 'pvp_doyus_resolver_testi.js'
      - 'pvp_doyus_settlement_sistemi.js'
      - 'pvp_doyus_settlement_sistemi_testi.js'
      - 'pvp_doyus_raport_sistemi.js'
      - 'pvp_doyus_raport_sistemi_testi.js'
      - 'pvp_doyus_raport_settlement_korpu.js'
      - 'pvp_seher_davamliliq_sistemi.js'
      - 'pvp_seher_davamliliq_sistemi_testi.js'
      - 'pvp_zeroing_yerdeyisme_sistemi.js'
      - 'pvp_zeroing_yerdeyisme_sistemi_testi.js'
      - 'pvp_zeroing_konvoy_recall_postcommit.js'
      - 'pvp_zeroing_konvoy_recall_postcommit_testi.js'
      - 'pvp_resurs_talani_sistemi.js'
      - 'pvp_resurs_talani_sistemi_testi.js'
      - 'pvp_anbar_qoruma_sistemi.js'
      - 'pvp_anbar_qoruma_sistemi_testi.js'
      - 'pvp_settlement_live_override.js'
      - 'pvp_settlement_live_override_testi.js'
      - 'pvp_qoruma_sistemi.js'
      - 'pvp_qoruma_sistemi_testi.js'
      - 'pvp_shield_item_sistemi.js'
      - 'pvp_shield_item_sistemi_testi.js'
      - 'pvp_shield_handler.js'
      - 'dovlet_baza_kataloqu_postgres.js'
      - 'pvp_baza_hucum_start_xidmeti.js'
      - 'pvp_baza_hucum_catma_xidmeti.js'
      - 'pvp_baza_live_handler.js'
      - 'pvp_baza_live_handler_testi.js'
      - 'pvp_baza_report_status_handler.js'
      - 'iki_oyuncu_state_mutasiya_postgres.js'
      - 'server_missiya_genisletme_v2.js'
      - '.github/workflows/qosun-server-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node qur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Paketleri qur
        run: npm ci
      - name: Qosun kataloqu testleri
        run: node qosun_kataloqu_testi.js
      - name: Qosun telimi testleri
        run: node qosun_telimi_pg_mutasiya_testi.js
      - name: Qosun telimi Inkisaf korpusu testleri
        run: node qosun_telimi_inkisaf_override_testi.js
      - name: Qosun doyus stat testleri
        run: node qosun_doyus_stat_sistemi_testi.js
      - name: Doyus inteqrasiya testleri
        run: node doyus_qosun_stat_inteqrasiya_testi.js
      - name: Doyus itki ve formasiya testleri
        run: node doyus_itki_stat_v2_testi.js
      - name: Merheleli doyus ve qarsi zerbe testleri
        run: node doyus_merheleli_resolver_testi.js
      - name: Doyus qosun lifecycle accounting testleri
        run: node doyus_qosun_lifecycle_testi.js
      - name: Konvoy tutum formulu testleri
        run: node konvoy_tutum_formulu_testi.js
      - name: Qehreman EXP progression testleri
        run: node qehreman_exp_progression_testi.js
      - name: Qehreman skill progression testleri
        run: node qehreman_skill_sistemi_testi.js
      - name: Qehreman Inkisaf sistemi testleri
        run: node qehreman_inkisaf_sistemi_testi.js
      - name: Texnologiya Inkisaf korpusu testleri
        run: node texnologiya_inkisaf_korpu_testi.js
      - name: Konvoy texnologiyasi Inkisaf inteqrasiya testleri
        run: node konvoy_texnologiya_inkisaf_inteqrasiya_testi.js
      - name: Tikinti Inkisaf korpusu testleri
        run: node tikinti_inkisaf_korpu_testi.js
      - name: Xestexana Inkisaf korpusu testleri
        run: node xestexana_inkisaf_override_testi.js
      - name: PvP konvoy mudafie snapshot testleri
        run: node pvp_doyus_snapshot_sistemi_testi.js
      - name: PvP iki teref server resolver testleri
        run: node pvp_doyus_resolver_testi.js
      - name: PvP atomic settlement testleri
        run: node pvp_doyus_settlement_sistemi_testi.js
      - name: PvP battle report testleri
        run: node pvp_doyus_raport_sistemi_testi.js
      - name: PvP seher davamliliq testleri
        run: node pvp_seher_davamliliq_sistemi_testi.js
      - name: PvP zeroing yerdeyisme testleri
        run: node pvp_zeroing_yerdeyisme_sistemi_testi.js
      - name: PvP zeroing post-commit convoy recall testleri
        run: node pvp_zeroing_konvoy_recall_postcommit_testi.js
      - name: PvP resurs talani testleri
        run: node pvp_resurs_talani_sistemi_testi.js
      - name: PvP anbar qoruma testleri
        run: node pvp_anbar_qoruma_sistemi_testi.js
      - name: PvP shield item testleri
        run: node pvp_shield_item_sistemi_testi.js
      - name: PvP live settlement override testi
        run: node pvp_settlement_live_override_testi.js
      - name: PvP qoruma ve tekrar-hucum testleri
        run: node pvp_qoruma_sistemi_testi.js
      - name: PvP live flow handler testleri
        run: node pvp_baza_live_handler_testi.js
