name: Qosun Server Testleri

on:
  push:
    branches:
      - server-troop-training-catalog-v1
      - server-troop-combat-stats-v1
      - server-casualty-combat-stats-v2
      - server-formation-combat-rows-v1
      - server-staged-combat-resolver-v1
      - server-combat-damage-exchange-v1
  pull_request:
    paths:
      - 'qosun_kataloqu.js'
      - 'qosun_kataloqu_testi.js'
      - 'qosun_telimi_sistemi.js'
      - 'qosun_telimi_handler.js'
      - 'qosun_telimi_pg_mutasiya_testi.js'
      - 'qosun_doyus_stat_sistemi.js'
      - 'qosun_doyus_stat_sistemi_testi.js'
      - 'doyus_formasiya_sistemi.js'
      - 'doyus_itki_sistemi.js'
      - 'doyus_itki_stat_v2_testi.js'
      - 'doyus_merheleli_resolver.js'
      - 'doyus_merheleli_resolver_testi.js'
      - 'doyus_sistemi.js'
      - 'doyus_qosun_stat_inteqrasiya_testi.js'
      - 'xerite_dusmen_doyus_sistemi.js'
      - 'pvp_doyus_snapshot_sistemi.js'
      - 'server_missiya_genisletme_v2.js'
      - '.github/workflows/qosun-server-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node qur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Paketleri qur
        run: npm ci

      - name: Qosun kataloqu testleri
        run: node qosun_kataloqu_testi.js

      - name: Qosun telimi testleri
        run: node qosun_telimi_pg_mutasiya_testi.js

      - name: Qosun doyus stat testleri
        run: node qosun_doyus_stat_sistemi_testi.js

      - name: Doyus inteqrasiya testleri
        run: node doyus_qosun_stat_inteqrasiya_testi.js

      - name: Doyus itki ve formasiya testleri
        run: node doyus_itki_stat_v2_testi.js

      - name: Merheleli doyus ve qarsi zerbe testleri
        run: node doyus_merheleli_resolver_testi.js
