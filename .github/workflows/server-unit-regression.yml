name: Server Unit Regression

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-v2-scalable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply and validate
        run: |
          echo '' | base64 -d > /tmp/hotfix.py
          python3 /tmp/hotfix.py
          node --check server.js
          node runtime_deploy_import_order_testi.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js runtime_deploy_import_order_testi.js
          git commit -m "Fix runtime deploy config import order"
          git push origin HEAD:server-v2-scalable
