name: Server Unit Regression

on:
  pull_request:
    paths:
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - "server_unity_message_contract.json"
      - "building_definitions.json"
      - ".github/workflows/server-unit-regression.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - "server_unity_message_contract.json"
      - "building_definitions.json"
      - ".github/workflows/server-unit-regression.yml"

jobs:
  unit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node qur
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Paketləri qur
        run: npm ci

      - name: Last Shelter science hero skill source contract
        run: node last_shelter_science_hero_skill_reference_testi.js

      - name: Xarici servis tələb etməyən bütün regression testləri
        run: npm test
