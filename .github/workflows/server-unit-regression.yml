name: Server Unit Regression

on:
  pull_request:
    paths:
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-unit-regression.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-unit-regression.yml"

permissions:
  contents: write

jobs:
  unit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node qur
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Paketləri qur
        run: npm ci

      - name: Xarici servis tələb etməyən bütün regression testləri
        run: npm test

  runtime-deploy-import-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-v2-scalable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply import-order fix and regression guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          block = '''const {\n  runtimeDeployConfiginiAl,\n  runtimeDeployConfiginiYoxla,\n  runtimeDeployPublicMelumatiniAl\n} = require("./runtime_deploy_config");\n'''
          if s.count(block) != 1:
              raise SystemExit(f'expected exactly one deploy-config import block, found {s.count(block)}')
          use = 'const runtimeDeployConfig =\n  runtimeDeployConfiginiYoxla('
          if use not in s:
              raise SystemExit('runtimeDeployConfig initialization anchor not found')
          s = s.replace(block, '', 1)
          anchor = 'const {\n  sifreSifirlamaMesajiniEmalEt\n} = require("./sifre_sifirlama_handler");\n'
          if anchor not in s:
              raise SystemExit('top-level import anchor not found')
          s = s.replace(anchor, anchor + '\n' + block, 1)
          p.write_text(s, encoding='utf-8')
          Path('runtime_deploy_import_order_testi.js').write_text(r'''"use strict";
const assert = require("assert");
const fs = require("fs");
const path = require("path");
const source = fs.readFileSync(path.join(__dirname, "server.js"), "utf8");
const importIndex = source.indexOf('require("./runtime_deploy_config")');
const firstUseIndex = source.indexOf("const runtimeDeployConfig =");
assert(importIndex >= 0, "runtime_deploy_config importu tapilmadi");
assert(firstUseIndex >= 0, "runtimeDeployConfig ilkinlesdirilmesi tapilmadi");
assert(importIndex < firstUseIndex, "runtime_deploy_config funksiyalari require edilmeden evvel istifade olunur");
console.log("runtime deploy import order testi kecdi");
''', encoding='utf-8')
          Path('.github/workflows/runtime-deploy-import-order-hotfix.yml').unlink(missing_ok=True)
          PY
          git checkout HEAD^ -- .github/workflows/server-unit-regression.yml
      - name: Validate hotfix
        run: |
          node --check server.js
          node runtime_deploy_import_order_testi.js
      - name: Commit coherent hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A server.js runtime_deploy_import_order_testi.js .github/workflows/server-unit-regression.yml .github/workflows/runtime-deploy-import-order-hotfix.yml
          git commit -m "Fix runtime deploy config import order"
          git push origin HEAD:server-v2-scalable
