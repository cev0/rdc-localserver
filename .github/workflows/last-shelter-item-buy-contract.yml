name: Last Shelter Item Buy Contract

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'last_shelter_item_buy_contract.js'
      - 'last_shelter_item_buy_contract_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-item-buy-contract.yml'
  pull_request:
    paths:
      - 'last_shelter_item_buy_contract.js'
      - 'last_shelter_item_buy_contract_testi.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-item-buy-contract.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_item_buy_contract_testi.js
