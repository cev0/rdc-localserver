name: Last Shelter Unified Init Runtime

on:
  push:
    branches: [server-v2-scalable]
    paths:
      - 'runtime_last_shelter_init_command.js'
      - 'runtime_last_shelter_init_command_testi.js'
      - 'runtime_auth_command.js'
      - 'runtime_auth_command_testi.js'
      - 'last_shelter_init_projection.js'
      - 'last_shelter_fresh_init_envelope_reference.js'
      - 'last_shelter_auxiliary_runtime_reference.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-unified-init-runtime.yml'
  pull_request:
    paths:
      - 'runtime_last_shelter_init_command.js'
      - 'runtime_last_shelter_init_command_testi.js'
      - 'runtime_auth_command.js'
      - 'runtime_auth_command_testi.js'
      - 'last_shelter_init_projection.js'
      - 'last_shelter_fresh_init_envelope_reference.js'
      - 'last_shelter_auxiliary_runtime_reference.js'
      - 'server.js'
      - 'server_unit_regressiya_testi.js'
      - '.github/workflows/last-shelter-unified-init-runtime.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node last_shelter_fresh_init_envelope_reference_testi.js
      - run: node last_shelter_init_projection_testi.js
      - run: node runtime_last_shelter_init_command_testi.js
      - run: node runtime_auth_command_testi.js
